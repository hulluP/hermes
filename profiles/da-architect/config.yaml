model:
  provider: custom
  base_url: "http://localhost:6655/litellm/v1"
  default: "anthropic--claude-4.7-opus"

mcp_servers:
  opencode-mcp:
    transportType: stdio
    command: npx
    args:
      - -y
      - opencode-mcp
    env: {}
    toolMode: all

  cds-mcp:
    transportType: stdio
    command: npx
    args:
      - -y
      - "@cap-js/mcp-server"
    env: {}
    toolMode: all

